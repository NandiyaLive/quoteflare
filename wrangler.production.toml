name = "quoteflare"
main = "src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = false
preview_urls = false
routes = [{ pattern = "invoices.neranjana.me", custom_domain = true }]

[triggers]
crons = ["30 3 * * *"]

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
# Invocation logs record request paths, and /i/<token> is a bearer credential.
invocation_logs = false
persist = true

[observability.traces]
enabled = false

[observability.issues]
enabled = true

[vars]
ACCESS_TEAM_DOMAIN = "neranjana.cloudflareaccess.com"
TURNSTILE_SITE_KEY = "0x4AAAAAAFLs7TZo8Q7quaZ0"
EMAIL_FROM = "Invoices <invoices@neranjana.me>"
APP_ORIGIN = "https://invoices.neranjana.me"
ALLOWED_ORIGINS = "https://invoices.neranjana.me"

[[d1_databases]]
binding = "DB"
database_name = "quoteflare"
database_id = "8d4d4fd9-b587-40c8-a158-1fd725639241"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "FILES"
bucket_name = "quoteflare-files"

# Per-IP limits on the public endpoints. namespace_id only has to be unique
# within your Cloudflare account.
[[ratelimits]]
name = "QUOTE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "INVOICE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
