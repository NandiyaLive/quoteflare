name = "quoteflare"
main = "src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true
preview_urls = false
routes = [{ pattern = "invoices.neranjana.me", custom_domain = true }]

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

[vars]
ACCESS_TEAM_DOMAIN = "neranjana.cloudflareaccess.com"
TURNSTILE_SITE_KEY = "0x4AAAAAAFLs7TZo8Q7quaZ0"
EMAIL_FROM = "Invoices <invoices@neranjana.me>"

[[d1_databases]]
binding = "DB"
database_name = "quoteflare"
database_id = "e8527523-f135-403c-8325-ea1f32a8a519"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "FILES"
bucket_name = "quoteflare-files"
