name = "quoteflare"
main = "src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[triggers]
crons = ["30 3 * * *"]

[observability]
enabled = true

# The Deploy to Cloudflare button creates the D1 database and R2 bucket for
# these bindings in the deployer's account. Set the vars below after deploying.
[vars]
ACCESS_TEAM_DOMAIN = ""
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
EMAIL_FROM = ""
APP_ORIGIN = ""
ALLOWED_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "quoteflare"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "FILES"
bucket_name = "quoteflare-files"
