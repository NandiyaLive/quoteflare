name = "quotekit"
main = "src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true
preview_urls = false
routes = [{ pattern = "invoices.neranjana.me", custom_domain = true }]

[vars]
ACCESS_TEAM_DOMAIN = "neranjana.cloudflareaccess.com"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "quotekit"
database_id = "e8527523-f135-403c-8325-ea1f32a8a519"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "FILES"
bucket_name = "quotekit-files"
