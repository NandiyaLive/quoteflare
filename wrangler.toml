# Generic config for local development and the Deploy to Cloudflare button.
# For your own deployment, copy it to wrangler.production.toml (gitignored) and
# add remote = true to its D1 binding.
name = "quoteflare"
main = "src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
keep_vars = true

# Add your domain, e.g. routes = [{ pattern = "invoices.example.com", custom_domain = true }].
workers_dev = false
preview_urls = false
routes = []

[triggers]
crons = ["30 3 * * *"]

# /i/<token> is a bearer credential, so keep it out of the logs.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = true

[observability.traces]
enabled = false

[observability.issues]
enabled = true

# A var listed here overwrites the dashboard value on every deploy, even with
# keep_vars. Put real values in wrangler.production.toml instead.
[vars]
ACCESS_TEAM_DOMAIN = ""
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"  # Cloudflare always-pass test key
EMAIL_FROM = ""  # a domain verified in Resend
APP_ORIGIN = "http://localhost:3000"  # base URL for invoice links in cron emails
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:5173"  # comma separated, for /api/public/*

# When you create the D1 database yourself, add database_id.
[[d1_databases]]
binding = "DB"
database_name = "quoteflare"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "FILES"
bucket_name = "quoteflare"

# Per-IP limits on the public endpoints.
[[ratelimits]]
name = "QUOTE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "INVOICE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
