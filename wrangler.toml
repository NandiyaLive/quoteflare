# Generic config for local development and the Deploy to Cloudflare button.
# For your own deployment, copy this file to wrangler.production.toml, which git
# ignores, and change these things there:
#   - Fill in [vars] and set the database_id on the D1 binding.
#   - Add remote = true to the D1 binding so `services:import:remote` can reach it.
#   - Add routes = [{ pattern = "invoices.example.com", custom_domain = true }].
#   - Add workers_dev = false and preview_urls = false.
#   - Under [observability], set redact_query_string = true and add
#     [observability.logs] with invocation_logs = false, because /i/<token> is
#     a bearer credential.
name = "quoteflare"
main = "src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[triggers]
crons = ["30 3 * * *"]

[observability]
enabled = true

# The Deploy to Cloudflare button creates the D1 database and R2 bucket for
# these bindings in the deployer's account. Set the vars below after deploying.
[vars]
ACCESS_TEAM_DOMAIN = ""
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
EMAIL_FROM = ""
APP_ORIGIN = ""
ALLOWED_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "quoteflare"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "FILES"
bucket_name = "quoteflare-files"

# Per-IP limits on the public endpoints. namespace_id only has to be unique
# within your Cloudflare account.
[[ratelimits]]
name = "QUOTE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "INVOICE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
